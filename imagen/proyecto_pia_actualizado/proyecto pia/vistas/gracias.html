      overflow: hidden;
    }

    h1 {
      font-size: 3rem;
      text-shadow: 2px 2px 8px rgba(0,0,0,0.4);
      margin-bottom: 50px;
      text-align: center;
      animation: aparecer 2s ease-in-out;
    }

    @keyframes aparecer {
      from { opacity: 0; transform: translateY(-30px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .auto {
      position: relative;
      width: 250px;
      height: 150px;

      animation: moverAuto 7s linear infinite;
    }

    @keyframes moverAuto {
      0% { transform: translateX(120vw); }
      50% { transform: translateX(0); }
      100% { transform: translateX(-120vw); }
    }

    p {
      font-size: 1.3rem;
      margin-top: 40px;
      color: #f3a8a8;
      text-shadow: 1px 1px 6px rgba(0,0,0,0.5);

      background-color: rgb(252, 177, 177);
      color: #f04a8a;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
      transition: 0.3s;
    }

    button:hover {
      background-color: #f04a8a;
      color: white;
      transform: scale(1.1);
    }
